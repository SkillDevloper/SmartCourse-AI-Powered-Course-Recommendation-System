{% extends "base.html" %}

{% block content %}
<div class="container my-5">
    <h1 class="mb-4"><i class="fas fa-tachometer-alt"></i> User Dashboard</h1>
    
    <div class="row">
        <!-- Search History -->
        <div class="col-lg-6 mb-4">
            <div class="card shadow-sm h-100">
                <div class="card-header bg-info text-white">
                    <h4 class="mb-0"><i class="fas fa-history"></i> Search History</h4>
                </div>
                <div class="card-body">
                    <div id="historyLoading" class="text-center">
                        <div class="spinner-border text-info" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                    </div>
                    <div id="searchHistory"></div>
                </div>
            </div>
        </div>

        <!-- Saved Courses -->
        <div class="col-lg-6 mb-4">
            <div class="card shadow-sm h-100">
                <div class="card-header bg-warning text-dark">
                    <h4 class="mb-0"><i class="fas fa-bookmark"></i> Saved Courses</h4>
                </div>
                <div class="card-body">
                    <div id="savedLoading" class="text-center">
                        <div class="spinner-border text-warning" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                    </div>
                    <div id="savedCourses"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Comparison Section -->
    <div class="row mt-4">
        <div class="col-12">
            <div class="card shadow-sm">
                <div class="card-header bg-secondary text-white">
                    <h4 class="mb-0"><i class="fas fa-balance-scale"></i> Model Comparison</h4>
                </div>
                <div class="card-body">
                    <p class="text-muted">Select a search from your history to compare TF-IDF vs Neural model results.</p>
                    <div id="comparisonSection"></div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
{% endblock %}
